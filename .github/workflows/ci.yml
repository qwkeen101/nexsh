name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 核心库、终端库和命令行工具：不需要窗口系统，三个平台都跑测试。
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: bash
        env:
          # 日志要拿去匹配错误行，不带颜色控制符。
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log
      # 失败时把错误内容输出成标注，不登录也能在任务页面和 API 里看到。
      - name: Report test errors
        if: failure()
        shell: bash
        run: |
          report() {
            local title="$1" body
            body="$(cat)"
            [ -z "$body" ] && return
            body="${body//'%'/'%25'}"
            body="${body//$'\r'/}"
            body="${body//$'\n'/'%0A'}"
            echo "::error title=${title}::${body}"
          }
          grep -n -E -A14 '^(error|Error|ERROR)|panicked at|^failures:' test.log | head -c 3500 | report "test errors (first)" || true
          tail -n 40 test.log | tail -c 3500 | report "test log tail" || true

  # 桌面界面：编译发布版并上传可执行文件。日常只编译 Windows（测试用的平台），
  # 手动运行这个工作流时三个平台都编译。
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 截图要推到 ci-screenshots 分支。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","artifact":"nexsh-linux-x86_64","binary":"target/release/nexsh"},{"os":"macos-latest","artifact":"nexsh-macos-arm64","binary":"target/release/nexsh"},{"os":"windows-latest","artifact":"nexsh-windows-x86_64","binary":"target/release/nexsh.exe"}]' || '[{"os":"windows-latest","artifact":"nexsh-windows-x86_64","binary":"target/release/nexsh.exe"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libasound2-dev libfontconfig-dev libssl-dev libzstd-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan1
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release -p nexsh-app 2>&1 | tee build.log
      # 失败时把错误内容输出成标注，不登录也能在任务页面和 API 里看到。
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          report() {
            local title="$1" body
            body="$(cat)"
            [ -z "$body" ] && return
            body="${body//'%'/'%25'}"
            body="${body//$'\r'/}"
            body="${body//$'\n'/'%0A'}"
            echo "::error title=${title}::${body}"
          }
          grep -n -E -A14 '^(error|Error|ERROR)' build.log | head -c 3500 | report "build errors (first)" || true
          grep -n -E -B2 -A14 '^(error|Error|ERROR)' build.log | tail -c 3500 | report "build errors (last)" || true
          tail -n 40 build.log | tail -c 3500 | report "build log tail" || true
      # 启动程序截几张图，推到 ci-screenshots 分支。截图失败不算构建失败。
      - name: Screenshot
        if: runner.os == 'Windows' && github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/screenshot.ps1 -Exe target/release/nexsh.exe -Out shots
      - name: Publish screenshots
        if: runner.os == 'Windows' && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -q -m "screenshots of $GITHUB_SHA"
          git push -f "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" ci-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

name: Release

# 推送形如 v0.1.0 的标签时，只编译 Windows 版并创建 GitHub Release：日常测试只用 Windows，
# 不必每次等另外两个平台。
#
# 需要 macOS 和 Linux 的安装包时，在 Actions 页面手动运行这个工作流并填入标签，
# 它会编译这两个平台并把安装包补进同一个 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要补齐 macOS 和 Linux 安装包的版本标签，例如 v0.1.6
        required: true

env:
  CARGO_TERM_COLOR: always
  # 版本标签：推送标签时就是它，手动运行时取输入。
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","name":"linux-x86_64"},{"os":"macos-latest","name":"macos-arm64"}]' || '[{"os":"windows-latest","name":"windows-x86_64"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libasound2-dev libfontconfig-dev libssl-dev libzstd-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan1
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release -p nexsh-app -p nexsh-cli 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          body="$(tail -n 40 build.log | tail -c 3500)"
          body="${body//'%'/'%25'}"
          body="${body//$'\r'/}"
          body="${body//$'\n'/'%0A'}"
          echo "::error title=build log tail::${body}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="nexsh-${TAG}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/nexsh target/release/nexsh-cli README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

          # .deb 安装包（Debian / Ubuntu）。
          version="${TAG#v}"
          pkg="deb/nexsh"
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/share/applications"
          cp target/release/nexsh target/release/nexsh-cli "$pkg/usr/bin/"
          cp installer/nexsh.desktop "$pkg/usr/share/applications/"
          cat > "$pkg/DEBIAN/control" <<CONTROL
          Package: nexsh
          Version: ${version}
          Architecture: amd64
          Maintainer: nexsh <noreply@github.com>
          Depends: libc6, libfontconfig1, libxkbcommon0, libxcb1, libvulkan1
          Section: net
          Priority: optional
          Homepage: https://github.com/qwkeen101/nexsh
          Description: GPU-rendered SSH client
           Native cross-platform SSH client written in Rust.
          CONTROL
          dpkg-deb --build --root-owner-group "$pkg" "nexsh-${TAG}-${{ matrix.name }}.deb"

      # macOS 打成 .app，双击即可启动；命令行工具放在压缩包根目录。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${TAG#v}"
          dir="nexsh-${TAG}-${{ matrix.name }}"
          app="$dir/nexsh.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/release/nexsh "$app/Contents/MacOS/nexsh"
          cp target/release/nexsh-cli README.md "$dir/"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>nexsh</string>
            <key>CFBundleDisplayName</key><string>nexsh</string>
            <key>CFBundleIdentifier</key><string>dev.nexsh.app</string>
            <key>CFBundleExecutable</key><string>nexsh</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # 没有开发者证书，用临时签名；Apple 芯片要求可执行文件至少有临时签名。
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$dir" "$dir.zip"

          # .dmg 安装镜像：打开后把 nexsh 拖进 Applications。
          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname nexsh -srcfolder dmg -ov -format UDZO "$dir.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="nexsh-${TAG}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/nexsh.exe target/release/nexsh-cli.exe README.md "$dir/"
          7z a "$dir.zip" "$dir"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NEXSH_TAG: ${{ env.TAG }}
        run: |
          $env:NEXSH_VERSION = $env:NEXSH_TAG.TrimStart('v')
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\nexsh.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            nexsh-*.tar.gz
            nexsh-*.zip
            nexsh-*.deb
            nexsh-*.dmg
            nexsh-*-setup.exe
          if-no-files-found: error

  # Android 安装包：只在推送标签时构建。
  android:
    name: build (android)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.build.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build
        id: build
        shell: bash
        env:
          # 固定的签名密钥（PKCS#12，base64）。配了它，每个版本的签名一致，可以覆盖安装。
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexsh-release.p12"
            export NEXSH_KEYSTORE="$RUNNER_TEMP/nexsh-release.p12"
            # 密钥库本身就是那个 Secret；口令只是文件格式的要求，不承担保密。
            export NEXSH_KEYSTORE_PASSWORD="nexsh-release"
            echo "signing=fixed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Android 签名::没有配置 ANDROID_KEYSTORE_BASE64，这个包用的是临时调试签名，不能覆盖安装。"
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi
          cargo ndk -t arm64-v8a -o mobile/android/app/src/main/jniLibs build --release -p nexsh-mobile
          # 版本号 v1.2.3 对应版本码 10203，新版本总比旧版本大。
          export NEXSH_VERSION="${TAG#v}"
          IFS=. read -r major minor patch <<< "$NEXSH_VERSION"
          export NEXSH_VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          (cd mobile/android && gradle --no-daemon --console=plain assembleRelease)
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "nexsh-${TAG}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: nexsh-*.apk
          if-no-files-found: error

  release:
    name: publish release
    # Android 包没打出来也照常发布桌面端的。
    needs: [build, android]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      # 两次运行各传各的校验和文件，互不覆盖。
      - name: Checksums
        run: |
          cd dist
          sha256sum nexsh-* > "SHA256SUMS-${{ github.event_name == 'push' && 'windows' || 'macos-linux' }}.txt"
          cat SHA256SUMS-*.txt
      - name: Create release (Windows)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 1.0 之前的版本都标记为预发布。
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          body: |
            nexsh ${{ github.ref_name }}

            Windows (x86_64)：安装包 `nexsh-${{ github.ref_name }}-windows-x86_64-setup.exe`，免安装压缩包 `…-windows-x86_64.zip`。
            里面都有桌面程序 `nexsh` 和命令行工具 `nexsh-cli`。

            Android (arm64)：`nexsh-${{ github.ref_name }}-android-arm64.apk`，试验版。
            ${{ needs.android.outputs.signing == 'fixed' && '这个包用固定密钥签名，可以直接覆盖安装同样用固定密钥签名的旧版；从 v0.1.10 及更早的版本升级需要先卸载一次。' || '这个包用的是临时调试签名，升级时系统会提示签名不一致，需要先卸载旧版（已保存的主机会一并清除）。' }}

            安装程序没有代码签名，SmartScreen 拦截时点"更多信息 → 仍要运行"。

            macOS 和 Linux 的安装包按需另行构建。已知限制见仓库 README。
      # 手动补齐其他平台：只往已有的 Release 里追加文件，不改说明。
      - name: Add macOS and Linux packages
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}

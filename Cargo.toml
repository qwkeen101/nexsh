[workspace]
resolver = "2"
members = [
    "crates/nexsh-core",
    "crates/nexsh-term",
    "crates/nexsh-cli",
    "crates/nexsh-app",
    "crates/nexsh-mobile",
]
# vendor 下是打过补丁的第三方库，不属于工作区成员。
exclude = ["vendor"]
# 默认只构建不依赖 GPU/窗口系统的部分；界面用 `cargo build -p nexsh-app`。
default-members = ["crates/nexsh-core", "crates/nexsh-term", "crates/nexsh-cli", "crates/nexsh-mobile"]

[workspace.package]
version = "0.1.19"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
nexsh-core = { path = "crates/nexsh-core" }
nexsh-term = { path = "crates/nexsh-term" }

alacritty_terminal = "0.26"
anyhow = "1"
crossterm = "0.29"
directories = "6"
gpui = "0.2.2"
keyring = "4"
log = "0.4"
rpassword = "7"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
toml = "1"

# GPUI 间接依赖的 xattr 0.2.3 与新版 libc 在 Linux 上不兼容，说明见 vendor/xattr/README.md。
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
